name: Build ChatDep APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk ChatDep.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatDep-APK
          path: ChatDep.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ChatDep.apk --clobber
          else
            gh release create latest ChatDep.apk \
              --title "ChatDep AI (APK)" \
              --notes "APK compilado automáticamente desde GitHub Actions para instalar en Android."
          fi
